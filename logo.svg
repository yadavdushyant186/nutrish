<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none" class="w-auto h-12">
  <defs>
    <!-- Rich Gold Gradients -->
    <linearGradient id="nutrishGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF3E3" />
      <stop offset="30%" stop-color="#F2C879" />
      <stop offset="70%" stop-color="#D49B55" />
      <stop offset="100%" stop-color="#A56E2B" />
    </linearGradient>
    
    <linearGradient id="forestShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3E30" />
      <stop offset="50%" stop-color="#142B21" />
      <stop offset="100%" stop-color="#0D1D16" />
    </linearGradient>
    
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84B692" />
      <stop offset="100%" stop-color="#3D7E67" />
    </linearGradient>

    <!-- Drop Shadow Filter for Luxury Depth -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0D1D16" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ================= EMBLEM BADGE (54x54) ================= -->
  <g transform="translate(3, 3)" filter="url(#badgeShadow)">
    <!-- Base Badge Cushion (Soft Rounded Hexagon / Squircle) -->
    <rect x="0" y="0" width="54" height="54" rx="18" fill="url(#forestShield)" stroke="url(#nutrishGold)" stroke-width="1.5" />
    
    <!-- Inner Delicate Ring -->
    <circle cx="27" cy="27" r="22.5" fill="none" stroke="url(#nutrishGold)" stroke-width="0.75" stroke-dasharray="2 1.5" opacity="0.6" />

    <!-- Organic Almond / Seed Pod Silhouette in Gold -->
    <path d="M 27 10 C 35 15, 41 24, 38 34 C 35 43, 27 46, 23 44 C 18 41, 16 32, 19 22 C 21 16, 25 11, 27 10 Z" 
          fill="none" stroke="url(#nutrishGold)" stroke-width="1.2" opacity="0.4" />

    <!-- Sprouting Botanical Leaves (Top-Left Accent) -->
    <path d="M 20 18 C 16 15, 14 11, 16 8 C 19 9, 21 13, 20 18 Z" fill="url(#leafGradient)" />
    <path d="M 22 17 C 22 13, 25 10, 28 9 C 27 13, 24 16, 22 17 Z" fill="url(#nutrishGold)" opacity="0.85" />

    <!-- Stylized Monogram Letter 'N' interwoven with Seed Curve -->
    <!-- Left Stem -->
    <path d="M 19 37 L 19 19 C 17.5 19, 16.5 19.5, 16 20 L 16 18 L 22 18 L 22 37 Z" fill="url(#nutrishGold)" />
    <!-- Diagonal Ribbon -->
    <path d="M 21.5 20.5 L 32.5 35.5 L 34.5 35.5 L 23.5 18 L 21.5 20.5 Z" fill="#FFFFFF" opacity="0.95" />
    <!-- Right Stem with Botanical Sprout Tip -->
    <path d="M 32 37 L 32 20 L 34.5 18.5 C 36 21, 36.5 24, 35 27 L 34.5 37 Z" fill="url(#nutrishGold)" />
    
    <!-- Tiny Golden Sun/Seed Bead at Bottom -->
    <circle cx="27" cy="41" r="1.5" fill="url(#nutrishGold)" />
  </g>

  <!-- ================= TYPOGRAPHIC WORDMARK ================= -->
  <g transform="translate(68, 12)">
    <!-- Main Brand Name: NUTRISH -->
    <text x="0" y="27" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" letter-spacing="0.5" fill="#14261D">
      Nutr<tspan fill="url(#nutrishGold)">i</tspan>sh
    </text>

    <!-- Subtitle Badge with Diamonds: ARTISANAL HARVESTS -->
    <g transform="translate(1, 41)">
      <text font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="800" letter-spacing="2.8" fill="#BD8037">
        ARTISANAL NUTS &amp; SEEDS
      </text>
    </g>
  </g>
</svg>
